name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tk
          POSTGRES_PASSWORD: tk
          POSTGRES_DB: tk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tk -d tk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      AUTH_DEV_MODE: "true"
      DATABASE_URL: postgresql+asyncpg://tk:tk@127.0.0.1:5432/tk
      EMBEDDING_PROVIDER: hashing
      LLM_PROVIDER: mock
      REQUIRE_TEST_DB: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install PDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
      - run: python -m pip install ".[dev]"
      - run: python -m ruff check .
      - run: alembic upgrade head
      - run: python -m app.cli seed
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
